<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <div id="message">
            You found something that wasn't meant to be found.
        </div>

        <div id="blackScreen"></div>

        <section id="archive">

            <div class="scanlines"></div>
            <div class="grid-background"></div>

            <header class="archive-header">

                <div class="archive-title">
                    ARCHIVE<span class="blink">-</span>
                </div>

                <div class="archive-status">
                    SYSTEM STATUS: ONLINE
                    </div>
            </header>

            <div class="file-grid">

                <div class="file">

                    <div class="file-icon">📁</div>

                    <div class="file-name">
                        UNKNOWN
                    </div>

                    <div class="file-info">
                        FILES: 03
                </div>


            </div>


            <div class="file">

                <div class="file-icon">📄</div>

                <div class="file-name">
                    SYSTEM_LOG
            </div>

                <div class="file-info">
                    12 KB
                </div>


            </div>


            <div class="file">

                <div class="file-icon">🖼️
            </div>

            <div class="file-name">
                IMAGE_001
                </div>

                <div class="file-info">
                    UNKNOWN
                </div>

                </div>

                <div class="file">

                    <div class="file-icon">🔒</div>

                    <div class="file-name">
                        LOCKED
                    </div>

                    <div class="file-info">
                        ACCESS DENIED
                    </div>


                </div>

                </div>

                <div class="archive-footer">
                    ARCHIVE // ACCESS LEVEL: UNKNOWN
                </div>

        </section>

        <script src="archive.js"></script>


    </body>

</html>
